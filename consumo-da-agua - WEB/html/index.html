<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroControl</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="container">

        <section class="login">

            <div class="logo">
                💧
            </div>

            <h1>Consumo de água</h1>

            <p>
                Controle de consumo de água
            </p>

            <div class="tema-box">
                <span>Tema escuro</span>

                <button
                    class="switch"
                    onclick="trocarTema()"
                    id="tema"
                >
                    <span></span>
                </button>
            </div>

            <button
                class="entrar"
                onclick="entrar()"
            >
                Entrar
            </button>

        </section>

    </main>

    <script src="../js/script.js"></script>

</body>

</html>
